<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BMC Tender Watch</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#1f2937;background:#f5f6f8}body{margin:0}.top{background:#fff;border-bottom:4px solid #c8102e;padding:20px 28px;display:flex;justify-content:space-between;gap:20px;align-items:center}.top h1{margin:0;font-size:28px}.top p{margin:4px 0 0;color:#6b7280}.btn{background:#c8102e;color:#fff;padding:11px 16px;text-decoration:none;border-radius:7px;font-weight:700}.wrap{max-width:1300px;margin:26px auto;padding:0 20px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.card,.panel{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:18px}.num{font-size:30px;font-weight:700}.muted{color:#6b7280;font-size:13px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.filters input,.filters select{padding:10px;border:1px solid #d1d5db;border-radius:7px;background:#fff}.tender{background:#fff;border:1px solid #e5e7eb;border-left:5px solid #c8102e;border-radius:10px;padding:18px;margin-bottom:13px}.tender h3{margin:0 0 7px}.meta{display:flex;gap:14px;flex-wrap:wrap;color:#4b5563;font-size:14px;margin:7px 0}.score{font-weight:700}.stars{letter-spacing:1px}.tag{display:inline-block;background:#f3f4f6;border-radius:999px;padding:5px 9px;margin:3px;font-size:12px}.source{font-size:12px;color:#6b7280}.open{display:inline-block;margin-top:10px;color:#c8102e;font-weight:700;text-decoration:none}.status li{margin:5px 0}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}}@media(max-width:480px){.cards{grid-template-columns:1fr}}
</style></head><body><header class="top"><div><h1>BMC Tender Watch</h1><p>Daily purchasing portal scan for relevant property maintenance opportunities</p></div><a class="btn" href="admin.html">Admin settings</a></header><main class="wrap"><section class="cards"><div class="card"><div class="muted">Relevant live tenders</div><div class="num" id="count">0</div></div><div class="card"><div class="muted">5-star opportunities</div><div class="num" id="five">0</div></div><div class="card"><div class="muted">Sources checked</div><div class="num" id="sources">0</div></div><div class="card"><div class="muted">Last scan</div><div id="last" style="font-weight:700;margin-top:9px">Not yet run</div></div></section><section class="panel"><div class="filters"><input id="q" placeholder="Search title, buyer or trade" size="34"><select id="stars"><option value="0">All scores</option><option value="5">5 stars</option><option value="4">4+ stars</option><option value="3">3+ stars</option></select><select id="source"><option value="">All sources</option></select></div><div id="list"></div></section><section class="panel status"><h3>Portal status</h3><ul id="status"></ul></section></main><script>
let data={tenders:[],sourceStatus:[]};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=(n,c='GBP')=>n?new Intl.NumberFormat('en-GB',{style:'currency',currency:c,maximumFractionDigits:0}).format(n):'Value not stated';const date=s=>{if(!s)return'Not stated';const d=new Date(s);return Number.isNaN(d)?s:d.toLocaleDateString('en-GB')};
function render(){const q=document.getElementById('q').value.toLowerCase(),min=+document.getElementById('stars').value,src=document.getElementById('source').value;const rows=data.tenders.filter(t=>(!q||[t.title,t.buyer,t.description,(t.matchedKeywords||[]).join(' ')].join(' ').toLowerCase().includes(q))&&(!min||t.stars>=min)&&(!src||t.source===src));document.getElementById('list').innerHTML=rows.length?rows.map(t=>`<article class="tender"><div class="source">${esc(t.source)}</div><h3>${esc(t.title)}</h3><div class="meta"><span><b>${esc(t.buyer||'Buyer not stated')}</b></span><span>${esc(t.location||'UK / location not stated')}</span><span>${money(t.value,t.currency)}</span><span>Deadline: ${date(t.deadline)}</span></div><div><span class="score">BMC score ${t.score}/100</span> <span class="stars">${'★'.repeat(t.stars)}${'☆'.repeat(5-t.stars)}</span></div><p>${esc((t.description||'').slice(0,420))}${(t.description||'').length>420?'…':''}</p><div>${(t.matchedKeywords||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>${t.url?`<a class="open" target="_blank" rel="noopener" href="${esc(t.url)}">Open tender ↗</a>`:''}</article>`).join(''):'<p>No tenders match the current filters.</p>'}
async function load(){try{const r=await fetch('data/tenders.json?'+Date.now());data=await r.json();document.getElementById('count').textContent=data.count||0;document.getElementById('five').textContent=(data.tenders||[]).filter(t=>t.stars===5).length;document.getElementById('sources').textContent=(data.sourceStatus||[]).filter(s=>String(s.status).startsWith('ok')).length;document.getElementById('last').textContent=data.generatedAt?new Date(data.generatedAt).toLocaleString('en-GB'):'Not yet run';const names=[...new Set((data.tenders||[]).map(t=>t.source))].sort();document.getElementById('source').innerHTML='<option value="">All sources</option>'+names.map(n=>`<option>${esc(n)}</option>`).join('');document.getElementById('status').innerHTML=(data.sourceStatus||[]).map(s=>`<li><b>${esc(s.name)}</b>: ${esc(s.status)}</li>`).join('')||'<li>No scan has run yet.</li>';render()}catch(e){document.getElementById('list').innerHTML='<p>Scan data is not available yet.</p>'}}document.querySelectorAll('#q,#stars,#source').forEach(x=>x.addEventListener('input',render));load();
</script></body></html>
